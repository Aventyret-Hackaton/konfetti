# The Mac app: the editor under ../web in a native window. A crate of its own, so that the language
# runtime in the root crate builds without Tauri. `make app` builds it.
[package]
name = "konfetti-app"
version = "0.0.8"
edition = "2024"

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# CoreLocation, for Wind: see `location` in src/main.rs.
objc2 = { version = "0.6", features = [] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSError"] }
objc2-core-location = { version = "0.3", default-features = false, features = ["std", "CLLocation", "CLLocationManager", "CLLocationManagerDelegate"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

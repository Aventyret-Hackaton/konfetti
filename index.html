<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#140a2e">
<title>Konfetti</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: radial-gradient(120% 90% at 50% 20%, #3a1d6e 0%, #1a0d3a 45%, #0a0518 100%);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #fff; user-select: none; -webkit-user-select: none;
  }
  canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hint {
    position: fixed; left: 0; right: 0;
    top: calc(env(safe-area-inset-top, 0px) + 14px);
    text-align: center; font-size: clamp(15px, 2.4vmin, 20px); font-weight: 600;
    letter-spacing: .04em; opacity: .85; pointer-events: none;
    transition: opacity .6s; text-shadow: 0 2px 12px #0008;
  }
  #hint.hidden { opacity: 0; }
  #legend {
    position: fixed; left: 0; right: 0;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
    display: flex; flex-wrap: wrap; justify-content: center; gap: 6px;
    padding: 0 10px; margin: 0; list-style: none;
  }
  #legend button {
    display: flex; align-items: center; gap: 6px;
    font: inherit; font-size: 12px; font-weight: 600; color: #fff;
    padding: 6px 10px; border-radius: 999px; border: 1px solid #ffffff22;
    background: #ffffff12; backdrop-filter: blur(6px); cursor: pointer;
    transition: transform .12s, background .25s, box-shadow .25s;
  }
  #legend i {
    width: 10px; height: 10px; border-radius: 3px; background: var(--c);
    transform: rotate(18deg); flex: none;
  }
  #legend button.hit {
    transform: scale(1.14); background: color-mix(in srgb, var(--c) 45%, transparent);
    box-shadow: 0 0 16px var(--c); transition: none;
  }
  @media (max-width: 520px) {
    #legend { gap: 4px; }
    #legend button { font-size: 11px; padding: 4px 8px; gap: 5px; }
  }
  #error { position: fixed; inset: 0; display: none; place-items: center; padding: 24px; text-align: center; }
</style>
</head>
<body>
<canvas id="scene" aria-label="Confetti bomb. Tap it to explode."></canvas>
<div id="hint">Tap the bomb</div>
<ul id="legend"></ul>
<div id="error"></div>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
<script type="module" src="./main.js"></script>
</body>
</html>
